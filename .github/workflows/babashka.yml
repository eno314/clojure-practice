name: Babashka CI

on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]

jobs:
    test:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Install Babashka
              run: |
                  curl -sLO https://raw.githubusercontent.com/babashka/babashka/master/install
                  chmod +x install
                  sudo ./install
                  bb --version

            - name: Run tests
              run: bb test
