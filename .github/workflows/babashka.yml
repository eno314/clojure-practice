name: Babashka CI

on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]

jobs:
    test:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Setup Babashka
              uses: turtlequeue/setup-babashka@v1.7.0
              with:
                  babashka-version: 1.12.213

            - name: Verify Babashka installation
              run: bb --version

            - name: Run tests
              run: bb test
